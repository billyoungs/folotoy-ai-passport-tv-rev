<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport TV · 连接设置</title><style>
:root{color-scheme:dark;--bg:#10151c;--panel:#1b2430;--ink:#f5f3ed;--muted:#b2bcc7;--accent:#ffc168}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:32px 22px 48px}header{border-bottom:1px solid #38414e;padding-bottom:20px}small,.hint{color:var(--muted)}.brand{color:var(--accent);font:700 14px monospace;letter-spacing:3px}h1{font-size:28px;line-height:1.3;margin:16px 0 8px}p{margin:8px 0}.step{display:inline-block;font-size:12px;border:1px solid #596573;border-radius:5px;padding:2px 8px;margin-top:12px}label{display:block;font-weight:600;margin-top:20px}input,select,button{width:100%;font:inherit;min-height:48px;border-radius:8px;padding:11px 12px;margin-top:7px}input,select{background:var(--panel);color:var(--ink);border:1px solid #647081}input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{background:var(--accent);color:#201508;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:var(--accent);border:1px solid #647081}.inline{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:400;margin-top:8px}.inline input{width:18px;min-height:18px;margin:0}.hint{font-size:13px;margin-top:6px}details{margin-top:22px}summary{cursor:pointer;color:var(--muted)}#status{position:sticky;top:8px;z-index:1;padding:14px;background:var(--panel);border-radius:8px;margin:20px 0;min-height:64px}#status[data-error=true]{border:1px solid #ed8f7e}#success{padding:22px 0}#success h2{color:#a6e3b5}footer{font-size:13px;color:var(--muted);margin-top:24px}noscript{color:#ffc168}
dialog{width:min(440px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:hidden;background:var(--panel);color:var(--ink);border:1px solid #647081;border-radius:12px;padding:0}dialog::backdrop{background:#000a}#cropForm{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}.crop-body{min-height:0;overflow-y:auto;padding:20px 24px 12px}#cropFields{border:0;padding:0;margin:0;min-width:0}#cropCanvas{display:block;width:min(264px,100%);height:auto;margin:16px auto;touch-action:none;cursor:grab;border-radius:8px}#cropCanvas:active{cursor:grabbing}#cropCanvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#avatarZoom{width:100%;padding:0;accent-color:var(--accent)}#zoomValue{float:right}.crop-preview{display:flex;align-items:center;gap:16px;color:var(--muted)}#cropPreview{width:88px;height:88px;border-radius:8px}#cropError{color:#ed8f7e;min-height:26px}.crop-actions{display:flex;flex-shrink:0;gap:12px;border-top:1px solid #38414e;padding:12px 24px max(12px,env(safe-area-inset-bottom))}.crop-actions button{margin-top:0}

/* Keep the existing palette while grouping controls around each task. */
main{padding:28px 22px 40px}header{border:0;padding:0 0 22px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand>span{font:400 13px system-ui;letter-spacing:0;color:var(--muted)}
.steps{display:flex;gap:8px;list-style:none;margin:28px 0 32px;padding:0;font-size:13px;color:var(--muted)}.steps li{flex:1;border-top:2px solid #38414e;padding-top:9px}.steps li[aria-current=step]{color:var(--accent);border-color:var(--accent);font-weight:700}.steps li.done{border-color:#8b775a}.steps li span{display:block;font-size:11px;font-weight:400}
.step{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);padding:0;border:0;margin:0}h1{font-size:32px;line-height:1.4;margin:0 0 14px}header>.hint{font-size:15px;line-height:1.8}h1:focus{outline:none}
.field-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.field-heading label{margin:0}.text-button{width:auto;min-height:44px;background:transparent;color:var(--accent);padding:6px 0;border:0;font-weight:400;text-decoration:underline;text-underline-offset:5px}.field-heading button{margin:0;flex-shrink:0}input,select{min-height:52px}#networkCount{margin-top:8px}#manualFields{margin:24px 0 28px}summary{color:var(--accent);font-size:14px;min-height:32px}#manualFields[open] summary{margin-bottom:10px}#manualFields label{margin-top:8px}
.password-field{position:relative}.password-field input[type=password],.password-field input[type=text]{padding-right:92px}.password-field .inline{position:absolute;right:12px;top:0;bottom:0;margin:7px 0 0;color:var(--accent);min-height:48px;cursor:pointer}.password-field .inline input{accent-color:var(--accent)}
#status{position:static;min-height:0;border-radius:0;border:0;border-left:2px solid #647081;padding:0 0 0 12px;margin:24px 0;color:var(--muted);background:transparent;font-size:13px}#status[data-error=true]{border:0;border-left:2px solid #ed8f7e;color:#edb3a8}#connect{min-height:54px;margin-top:0}#skip{display:block;margin:14px auto 0}#skip[hidden]{display:none}#back{display:block;margin:0 0 18px}#back[hidden]{display:none}#saveProfile{margin-top:24px}.profile-group{padding:22px 0;border-top:1px solid #38414e;border-bottom:1px solid #38414e}.profile-group summary{font-size:18px;font-weight:600;color:var(--ink)}.profile-group summary span{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px}#avatarPreview{display:block;margin:18px 0}#avatarPreview[hidden]{display:none}
#success{padding:4px 0}#success h2{font-size:30px;line-height:1.5;color:var(--ink);margin:20px 0}#success>p:not(.hint):not(.success-mark){color:var(--muted)}.success-mark{color:var(--accent);font-size:56px;line-height:1}.saved-summary{border-top:1px solid #38414e;border-bottom:1px solid #38414e;padding:22px 0;margin:28px 0}.saved-summary p{margin-bottom:0;overflow-wrap:anywhere}footer{border-top:1px solid #38414e;padding-top:20px;margin-top:28px;line-height:1.9}.local-note{text-align:center;margin-top:28px;font-size:12px}
@media(max-width:360px){main{padding-left:18px;padding-right:18px}h1{font-size:29px}.steps{font-size:12px}}

/* Compact personal settings: preview beside controls, with one final action. */
main{max-width:640px;padding:20px 20px 28px}header{padding-bottom:8px}.steps{margin:16px 0 18px;padding:0;gap:10px}.steps li{padding-top:6px}.steps li span{display:inline;margin-left:3px}h1{font-size:26px;margin-bottom:6px}header>.hint{font-size:13px;line-height:1.6}
#profileHint{font-size:12px;margin:4px 0 14px}.identity-fields{display:grid;gap:10px}.identity-fields label{margin:0}.field-note{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}.identity-fields input{margin-top:4px;min-height:44px;padding:9px 11px}
.profile-group{margin-top:16px;padding:12px 0;border-bottom:0}.profile-group summary{font-size:16px;min-height:32px}.profile-group summary span{font-size:12px}.card-editor{display:grid;grid-template-columns:minmax(112px,.9fr) minmax(0,1.1fr);gap:14px;margin-top:12px;align-items:start}.card-preview{min-width:0;max-width:180px}.card-controls{display:grid;gap:12px;min-width:0}.card-controls label{font-size:12px;margin:0}.card-controls input,.card-controls select{margin-top:4px;min-height:44px;padding:7px;font-size:13px;width:100%;min-width:0}.card-controls input[type=range]{padding:0;accent-color:var(--accent)}.color-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}.color-fields>div{min-width:0}
.crop-options{margin-top:8px}.crop-options summary{font-size:12px;min-height:32px}.crop-options label{font-size:12px;margin:4px 0}.crop-options input{margin:0;padding:0;min-height:32px;accent-color:var(--accent)}.card-tools{display:flex;gap:10px;margin-top:10px}.card-tools button{font-size:12px;padding:6px 10px;min-height:40px;margin:0;font-weight:500}.compact-note,#homePhotoStatus,#homeStyleStatus{font-size:11px;line-height:1.5;margin:6px 0 0}#homePhotoStatus:empty,#homeStyleStatus:empty{display:none}
input[type=file]{font-size:12px;min-height:42px;padding:7px;margin-top:8px;border-color:#38414e}input[type=file]::file-selector-button{background:#303c4b;color:var(--ink);border:0;border-radius:5px;padding:5px 8px;margin-right:8px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0;padding:0}.avatar-group label{font-size:13px;margin-top:10px}.avatar-group .hint{font-size:12px}#status{font-size:12px;margin:12px 0;padding-left:8px}.save-links{display:flex;justify-content:space-between;gap:12px}.save-links #back,.save-links #skip{font-size:12px;margin:2px 0 0;min-height:40px;text-decoration:none}#form[data-step="2"] .save-bar{position:sticky;bottom:0;z-index:2;background:var(--bg);padding:12px 0 max(4px,env(safe-area-inset-bottom));border-top:1px solid #38414e}#connect{min-height:46px;font-size:15px}footer{font-size:11px;line-height:1.6;margin-top:14px;padding-top:12px}.local-note{font-size:11px;margin-top:8px}
@media(min-width:560px){.identity-fields{grid-template-columns:.8fr 1.2fr}.card-editor{grid-template-columns:180px 1fr;gap:24px}.card-controls{gap:14px}.card-controls select{font-size:14px}}
@media(max-width:360px){main{padding:16px}.card-editor{gap:10px}.steps{font-size:11px}.profile-group summary span{font-size:11px}}
.network-row{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:var(--panel);color:var(--ink);border:1px solid #38414e;font-weight:400;margin-top:6px;min-height:50px}.network-row[aria-pressed=true]{border-color:var(--accent);background:#30291e}.network-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.network-strength{font-size:12px;color:var(--muted);white-space:nowrap}#networkList{display:grid;gap:7px;max-height:300px;overflow-y:auto;margin-top:8px}.network-row{margin-top:0}</style></head><body><main>
<header><p class="eyebrow">PASSPORT TV</p><ol class="steps"><li id="wifiStep">1 连接网络</li><li id="tvStep">2 电视连接</li><li>3 完成</li></ol>
<p id="stepLabel" class="step">Step 1 · 网络</p><h1 id="title">先连上网络。</h1><p class="hint">仅支持 2.4 GHz Wi-Fi。已保存的网络会自动连接。</p></header>
<form id="form"><fieldset id="networkFields" disabled style="border:0;padding:0;margin:0">
<div class="field-heading"><label >附近的 Wi-Fi</label><button class="text-button" id="scan" type="button">刷新列表</button></div>
<div id="networkList" role="group" aria-label="附近的 Wi-Fi" aria-describedby="networkCount"></div><p id="networkCount" class="hint">正在查找附近的网络…</p>
<details id="manualFields"><summary>找不到网络？手动输入</summary><label for="ssid">Wi-Fi 名称</label><input id="ssid" autocomplete="off" spellcheck="false" maxlength="32" placeholder="输入网络名称"></details>
<label for="password">Wi-Fi 密码</label><div class="password-field"><input id="password" type="password" autocomplete="new-password" maxlength="63" placeholder="请输入密码" aria-describedby="passwordHint"><label class="inline"><input id="showPassword" type="checkbox">显示</label></div><p id="passwordHint" class="hint">密码中的空格会原样保留，无密码可留空。</p>
<button id="saveProfile" class="secondary" type="button" hidden>修改个人形象</button>
</fieldset><section id="tvFields" hidden>
<label for="host">电视服务器（主机名或 HTTP(S) 地址）</label><input id="host" maxlength="128" placeholder="tv.example.com 或 https://tv.example.com" autocomplete="off" spellcheck="false"><p id="serverHint" class="hint">填写服务器主机名或地址；主机名使用下方端口。</p>
<label for="port">端口</label><input id="port" type="number" min="1" max="65535" value="10745">
<label for="token">配对码</label><input id="token" type="text" maxlength="4" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="输入 4 位字母数字码"><p class="hint">已配对的同一服务器可留空继续使用。</p>
<button id="back" type="button" class="secondary">修改网络</button></section>
<p id="status" role="status"></p><button id="connect" type="submit">保存并连接网络</button></form>
<section id="success" hidden><h2>连接设置已完成</h2><p>设备正在进入电视。</p></section></main><script>
const $=id=>document.getElementById(id),enc=new TextEncoder(),dec=new TextDecoder();
const errors={pairing:'配对未完成，请检查配对码、服务器和网络后重试。',password:'Wi-Fi 密码不正确，或不符合长度要求。',wifi:'Wi-Fi 连接失败，请检查名称、密码与信号。',fields:'请检查电视地址、端口和配对码。',network_first:'请先连接 Wi-Fi。',storage:'保存失败，请重试。',busy:'正在连接，请稍候。'};
let nearbyNetworks=[],step=1,busy=false,finished=false,pendingFinish=false,stateLoaded=false,savedOrigin='',defaultOrigin='',canRetain=false;
function originOf(input,port){input=input.trim();if(!input)input=defaultOrigin;if(!input||input.length>128)throw Error(errors.fields);const explicit=/^https?:\/\//.test(input);if(!explicit)input='http://'+input+(input.includes(':')?'':':'+port);if(!/^https?:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?$/.test(input))throw Error(errors.fields);const u=new URL(input);if(!u.hostname.split('.').every(x=>/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$/.test(x))||u.port==='0')throw Error(errors.fields);return u.origin;}
function message(text,error=false){$('status').textContent=text;$('status').dataset.error=String(error)}
function networkValues(){if(!$('ssid').value){$('manualFields').open=true;$('ssid').focus()}const ssid=enc.encode($('ssid').value),password=enc.encode($('password').value);if(!ssid.length||ssid.length>32)throw new Error('Wi-Fi 名称需为 1–32 个 UTF-8 字节。');if(password.length&&(password.length<8||password.length>63))throw new Error(errors.password);return {ssid,password}}
function renderNetworks(){
 const list=$('networkList');list.replaceChildren();
 const selected=$('ssid').value;
 for(const item of nearbyNetworks){
  const button=document.createElement('button');button.type='button';button.className='network-row';button.dataset.ssid=item.ssid;button.setAttribute('aria-pressed',String(item.ssid===selected));
  const name=document.createElement('span');name.className='network-name';name.textContent=item.ssid;
  const signal=document.createElement('span');signal.className='network-strength';signal.textContent=(item.rssi>=-55?'强':item.rssi>=-70?'良好':'较弱')+' · '+item.rssi+' dBm'+(item.ssid===selected?' ✓':'');
  button.append(name,signal);button.onclick=()=>{if($('ssid').value!==item.ssid)$('password').value='';$('ssid').value=item.ssid;$('manualFields').open=false;renderNetworks();$('password').focus()};list.append(button);
 }
}
function networks(items){
 const unique=new Map();for(const item of items){const ssid=dec.decode(item.ssid);if(ssid&&(!unique.has(ssid)||item.rssi>unique.get(ssid).rssi))unique.set(ssid,{ssid,rssi:item.rssi})}
 nearbyNetworks=Array.from(unique.values()).sort((a,b)=>b.rssi-a.rssi||a.ssid.localeCompare(b.ssid));renderNetworks();
 $('networkCount').textContent=nearbyNetworks.length?'已找到 '+nearbyNetworks.length+' 个网络 · 按信号强度排序 · 仅支持 2.4 GHz':'未找到网络，可刷新列表或手动输入。';
}

async function transport(path,body){const options={cache:'no-store'};if(body!==undefined){options.method='POST';options.headers={'Content-Type':'application/json'};if(body!==null)options.body=JSON.stringify(body)}const r=await fetch(path,options);if(!r.ok)throw Error(errors[(await r.text()).trim()]||'设备暂时无法处理，请重试。');return r.json()}
function show(value){step=value;$('networkFields').hidden=value!==1;$('tvFields').hidden=value!==2;$('stepLabel').textContent=value===1?'Step 1 · 网络':'Step 2 · 电视';$('title').textContent=value===1?'先连上网络。':'连接电视服务。';$('connect').textContent=value===1?'保存并连接网络':'保存并开始观看'}
$('back').onclick=()=>show(1);$('showPassword').onchange=()=>{$('password').type=$('showPassword').checked?'text':'password'};
$('scan').onclick=async()=>{try{await transport('/networks',null);message('正在查找附近的 Wi-Fi…')}catch(e){message(e.message,true)}};
$('form').onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;$('connect').disabled=true;
try{if(step===1){delete $('back').dataset.manual;const {ssid,password}=networkValues();await transport('/connect',{ssid:dec.decode(ssid),password:dec.decode(password)});message('正在连接 Wi-Fi，请保持设备热点连接。')}
else{if(!pendingFinish){if(!stateLoaded)throw Error('正在读取设备设置，请稍候。');const host=$('host').value.trim(),port=Number($('port').value),code=$('token').value.trim().toUpperCase();if(!Number.isInteger(port)||port<1||port>65535)throw Error(errors.fields);const origin=originOf(host,port);if(code?!/^[A-Z0-9]{4}$/.test(code):!(canRetain&&origin===savedOrigin))throw Error('请输入 4 位配对码；仅同一服务器可留空保留。');await transport('/configure',{host,port,code});pendingFinish=true;}await transport('/finish',{});finished=true;$('password').value='';$('token').value='';$('form').hidden=true;$('success').hidden=false;message('已保存，设备正在播放。')}}
catch(e){message(e.message,true)}finally{busy=false;$('connect').disabled=false}};
async function poll(){if(finished)return;try{const [state,list]=await Promise.all([transport('/status'),transport('/networks')]);
$('networkFields').disabled=busy||state.phase==='connecting';$('connect').disabled=busy||state.phase==='connecting';
if(state.phase==='saved')pendingFinish=true;defaultOrigin=state.default_origin||'';stateLoaded=true;
if(!$('host').dataset.touched)$('host').value=state.host||'';if(state.port&&!$('port').dataset.touched)$('port').value=state.port;
try{savedOrigin=originOf(state.host||'',state.port||10745)}catch{savedOrigin=''}canRetain=Boolean(state.has_token&&savedOrigin);
$('serverHint').textContent=defaultOrigin?'留空使用默认服务 '+defaultOrigin+'；主机名使用下方端口。':'填写服务器主机名或地址；主机名使用下方端口。';
$('token').placeholder=canRetain?'同一服务器留空保留配对':'输入 4 位字母数字码';
if(!nearbyNetworks.length&&state.ssid)$('ssid').value=state.ssid;
if(!list.scanning)networks(list.entries.map(item=>({ssid:Uint8Array.from(item.ssid_hex.match(/../g)||[],x=>parseInt(x,16)),rssi:item.rssi})));
if(state.phase==='network_saved'&&step===1&&!$('back').dataset.manual){show(2);$('password').value='';message('Wi-Fi 已连接，请确认电视地址。')}
if(state.phase==='connecting')message('正在连接 Wi-Fi…');if(state.phase==='error')message(errors[state.error]||'连接失败，请重试。',true);
}catch(e){message('请保持连接设备热点，正在查询结果。',true)}finally{if(!finished)setTimeout(poll,1000)}}
$('back').addEventListener('click',()=>{$('back').dataset.manual='1'});$('port').oninput=()=>{$('port').dataset.touched='1'};
$('host').oninput=()=>{$('host').dataset.touched='1'};
poll();
</script></body></html>
